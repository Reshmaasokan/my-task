<!DOCTYPE html>
<html>

<head>
    <title>Modal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <button class="btn btn-primary m-5" data-bs-toggle="modal" data-bs-target="#content">
        Click here!
    </button>
    <div class="modal container" id="content">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">Student Registration
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div>
                            <label for="name">Name</label>
                            <input type="text" id="name" class="form-control">
                        </div>
                        <div>

                            <label for="email">Email</label>
                            <input type="text" id="email" class="form-control">

                        </div>

                        <div>
                            <label for="course">Choose a course:</label>
                            <select id="course" name="course">
                                <option value="java">Java</option>
                                <option value="python">Python</option>
                                <option value="HTML">HTML</option>
                                <option value="css">CSS</option>
                            </select>
                        </div>

                        <div class="form-check">
                            <input type="radio" class="form-check-input" id="male" name="gender">
                            <label class="form-check-label" for="male">Male</label>
                        </div>

                        <div class="form-check">
                            <input type="radio" class="form-check-input" id="female" name="gender">
                            <label class="form-check-label" for="female">Female</label>
                        </div>

                        <div>
                            <input type="button" value="submit" class="btn btn-primary" data-bs-dismiss="modal">
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
