<!DOCTYPE html>
<html>
    <head>
        <title>Modal</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <button class="btn btn-primary mt-5" data-bs-toggle="modal" data-bs-target="#content">
            show more
        </button>

        <div class="modal container" id="content">
            <div class="modal-dialog">
                <div class="modal-content">
                    <h1 class="modal-header">Login</h1>
                    <div class="modal-body">Fill Up The Details
                        <button class="btn btn-primary align-self-end me-2">Submit</button>
                    </div>
                    <div class="model-footer">Thank You</div>
                    </div>
        
            </div>
        </div>


    </body>
</html>
