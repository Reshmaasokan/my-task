<!DOCTYPE html>
<html>
    <head>
        <title>Responsive-flex</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container-fluid d-flex flex-row flex-md-column gap-3 ">
            <img src="./media/ajith1.jpg" alt="ajith1" height="100px" width="100px">
            <img src="./media/ajith2.jpg" alt="ajith2" height="100px" width="100px">
            <img src="./media/collegeLogo.jpg" alt="logo" height="100px" width="100px">
        </div>

        
        <div class="d-flex">
            <div class="order-2 order-md-1">First</div>
            <div class="order-1 order-md-2">Second</div>
        </div>

        <div class="d-flex flex-column">
            <div class="align-self-start align-self-md-center">Item</div>
        </div>

    </body>
</html>
