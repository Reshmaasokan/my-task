<!DOCTYPE html>
<html>
    <head>
        <title>CSS Pseudo Class Selector</title>
        <link rel="stylesheet" href='./pseudoclassselector/pseudoClassSelector.css'>
    </head>
    <body>
        <div class="button1">
        <button type="button">button1</button>
        </div>

        <div class="button2">
            <input type="button" value="button2">
        </div>

        <div class="button3">
            <input type="submit" value="button3">
        </div>

        <div class="checkbox">
            <input type="checkbox" id="checkbox1">
            <label for="checkbox1">Checkbox</label>
        </div>
    </body>
</html>
