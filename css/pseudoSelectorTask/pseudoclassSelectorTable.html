<!DOCTYPE html>
<html>
    <head>
        <title>CSS Pseudo-class Selector Table</title>
        <link rel="stylesheet" href='./pseudoclassselector/pseudoclassSelectorTable.css'>
    </head>
    <body>
        <table border="1">
            <thead>
                <tr>
                    <th>S.no</th>
                    <th>student name</th>
                    <th>student age</th>
                    <th>student gender</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>John</td>
                    <td>20</td>
                    <td>Male</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Jane</td>
                    <td rowspan="2">22</td>
                    <td>Female</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Mike</td>
                    <td>Male</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4">Full attendance</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
