<!DOCTYPE html>
<html>
  <head>
    <title>course Modules</title>
  </head>
  <body>
<style>
    ol {
        counter-reset: section;
    }

    ol > li {
        counter-increment: section;
    }

    ol > li::before {
        content: counter(section) ". ";
    }

    ol > li ol {
        counter-reset: subsection;
    }

    ol > li ol > li {
        counter-increment: subsection;
    }

    ol > li ol > li::before {
        content: counter(section) "." counter(subsection) " ";
    }
</style>
<h2>Course Modules</h2>

    <ol>
        <li>Frontend
            <ol>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ol>
        </li>

        <li>Backend
            <ol>
                <li>Node.js</li>
                <li>Express.js</li>
            </ol>
        </li>

        <li>Database
            <ol>
                <li>MySQL</li>
                <li>MongoDB</li>
            </ol>
        </li>
    </ol>


</body>

</html>
